<!doctype html>
<html>
    <head>

	    <script type="text/javascript" src="/homey.js" data-origin="settings"></script>

		<style>
            fieldset {
                border: none;
                padding: 0;
            }
            #testresult {
                margin: 10px 0;
                word-break: break-word;
            }
            .error {
                color: #d0021b;
            }
		</style>

    </head>
    <body>

        <h1 class="homey-title" data-i18n="settings.mailsettings">Mail Settings</h1>
        <p data-i18n="settings.intro">On this page you can manage your SMTP mail settings.</p>

        <p data-i18n="settings.gmailexplanation"></p>

        <fieldset class="homey-form-fieldset">

            <div class="field row">
                <label class="homey-form-checkbox">
                    <input class="homey-form-checkbox-input" type="checkbox" name="use_credentials" id="use_credentials" checked/>
                    <span class="homey-form-checkbox-checkmark"></span>
                    <span class="homey-form-checkbox-text" data-i18n="settings.use_credentials">Use credentials</span>
                </label>
            </div>

            <fieldset id="credentials">
                <div class="field row">
                    <label class="homey-form-label" for="username" data-i18n="settings.username">Mail username</label>
                    <input class="homey-form-input" id="username" type="text" value="" />
                </div>
                <div class="field row">
                    <label class="homey-form-label" for="password" data-i18n="settings.password">Mail password</label>
                    <input class="homey-form-input" id="password" type="password" value="" />
                </div>
            </fieldset>

            <div class="field row">
                <label class="homey-form-label" for="hostname" data-i18n="settings.hostname">SMTP server</label>
                <input class="homey-form-input" id="hostname" type="text" value="" placeholder="mail.yourdomain.com" />
            </div>
            <div class="field row">
                <label class="homey-form-label" for="port" data-i18n="settings.port">SMTP port</label>
                <input class="homey-form-input" id="port" type="number" min="1" max="65535" value="" placeholder="587"/>
            </div>
            <div class="field row">
                <label class="homey-form-label" for="sender" data-i18n="settings.sender">Sender address</label>
                <input class="homey-form-input" id="sender" type="email" value="" placeholder="you@yourdomain.com"/>
            </div>
            <div class="field row">
                <label class="homey-form-label" for="sendername" data-i18n="settings.sendername">Sender name</label>
                <input class="homey-form-input" id="sendername" type="text" value="" placeholder="Homey"/>
            </div>
            <div class="field row">
                <label class="homey-form-checkbox">
                    <input class="homey-form-checkbox-input" type="checkbox" name="secure" id="secure"/>
                    <span class="homey-form-checkbox-checkmark"></span>
                    <span class="homey-form-checkbox-text" data-i18n="settings.encrypted_connection">Encrypted connection</span>
                </label>
                <p class="homey-form-help" data-i18n="settings.encrypted_connection_help"></p>
            </div>
            <div class="field row">
                <label class="homey-form-checkbox">
                    <input class="homey-form-checkbox-input" type="checkbox" name="allow_invalid_certificates" id="allow_invalid_certificates" checked/>
                    <span class="homey-form-checkbox-checkmark"></span>
                    <span class="homey-form-checkbox-text" data-i18n="settings.allow_invalid_certificates">Accept self-signed or invalid certificates</span>
                </label>
            </div>

        </fieldset>

        <div id="testresult"></div>

        <button id="savebutton" class="homey-button-primary-full" data-i18n="settings.saveSettings">Save changes</button>
        <button id="testbutton" class="homey-button-secondary-shadow-full" data-i18n="settings.testSettings">Test settings</button>

        <p>&nbsp;</p>
        <p>&nbsp;</p>


        <script type="text/javascript">

	    function onHomeyReady(Homey) {

	        const fields = {
	            use_credentials: {id: 'use_credentials', type: 'checkbox', default_value: true},
	            mail_user: {id: 'username'},
	            mail_password: {id: 'password'},
	            mail_host: {id: 'hostname'},
	            mail_port: {id: 'port'},
	            mail_from: {id: 'sender'},
	            sendername: {id: 'sendername'},
	            mail_secure: {id: 'secure', type: 'checkbox', default_value: false},
	            allow_invalid_certificates: {id: 'allow_invalid_certificates', type: 'checkbox', default_value: true}
	        };

	        const save_button = document.getElementById('savebutton');
	        const test_button = document.getElementById('testbutton');
	        const test_result = document.getElementById('testresult');
	        const use_credentials = document.getElementById('use_credentials');

	        function get_setting(key) {
	            return new Promise((resolve, reject) => {
	                Homey.get(key, (err, value) => err ? reject(err) : resolve(value));
	            });
	        }

	        function set_setting(key, value) {
	            return new Promise((resolve, reject) => {
	                Homey.set(key, value, err => err ? reject(err) : resolve());
	            });
	        }

	        function read_form() {
	            const values = {};

	            for (const key in fields) {
	                const element = document.getElementById(fields[key].id);
	                values[key] = fields[key].type === 'checkbox' ? element.checked : element.value.trim();
	            }

	            return values;
	        }

	        function update_credentials() {
	            document.getElementById('credentials').disabled = !use_credentials.checked;
	        }

	        function show_result(message, is_error) {
	            test_result.textContent = message;
	            test_result.className = is_error ? 'error' : '';
	        }

	        async function load_settings() {
	            for (const key in fields) {
	                const element = document.getElementById(fields[key].id);
	                const value = await get_setting(key);

	                if (fields[key].type === 'checkbox') {
	                    element.checked = value === null ? fields[key].default_value : value === true;
	                } else {
	                    element.value = value === null ? '' : value;
	                }
	            }

	            update_credentials();
	        }

	        use_credentials.addEventListener('change', update_credentials);

	        save_button.addEventListener('click', async () => {
	            save_button.disabled = true;
	            save_button.textContent = Homey.__('settings.saving');

	            try {
	                const values = read_form();

	                await Promise.all(Object.keys(values).map(key => set_setting(key, values[key])));

	                save_button.textContent = Homey.__('settings.saved');
	                show_result('');
	            } catch (err) {
	                save_button.textContent = Homey.__('settings.saveSettings');
	                show_result(err.message || err, true);
	            } finally {
	                save_button.disabled = false;
	            }
	        });

	        test_button.addEventListener('click', () => {
	            test_button.disabled = true;
	            show_result(Homey.__('settings.testing'));

	            Homey.api('POST', '/testmail', read_form(), (err, result) => {
	                test_button.disabled = false;

	                if (err) return show_result(err.message || err, true);

	                show_result(Homey.__('settings.test_sent') + ' ' + result.response);
	            });
	        });

	        load_settings()
	            .catch(err => show_result(err.message || err, true))
	            .finally(() => Homey.ready());

	    }

        </script>

    </body>
</html>
